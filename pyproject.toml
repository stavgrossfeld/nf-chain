[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nf-chain"
version = "0.1.0"
description = "Chain nf-core pipelines together with a simple import syntax."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "stav" }]
keywords = ["nextflow", "nf-core", "bioinformatics", "pipeline", "workflow"]
dependencies = []

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Environment :: Console",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/stavgrossfeld/nf-chain"
Repository = "https://github.com/stavgrossfeld/nf-chain"
"Bug Tracker" = "https://github.com/stavgrossfeld/nf-chain/issues"

[project.optional-dependencies]
dev = ["pytest", "build", "mypy"]

[project.scripts]
nf-chain = "nfchain.cli:main"
nfchain = "nfchain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nfchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
